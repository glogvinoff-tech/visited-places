{% extends "visited_places/base.html" %}
{% block content %}
  <a class="back-link" href="{% url cancel_url %}"><i data-lucide="arrow-left"></i>Назад</a>
  <div class="page-heading">
    <h1>{{ title }}</h1>
  </div>
  <form method="post" class="edit-form">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="form-actions"><button class="button" type="submit"><i data-lucide="check"></i>Сохранить</button><a class="button secondary" href="{% url cancel_url %}">Отмена</a></div>
  </form>
{% endblock %}
