{% load journal_display %}
{% with image=place|place_image %}
  <div class="photo-wrap">
    {% if image %}
      <img src="{{ image }}"
           alt="{% if place.place_name %}{{ place.place_name }}{% else %}{{ place.name }}{% endif %}"
           class="place-photo"
           loading="lazy"
           data-photo>
    {% endif %}
    <span class="photo-placeholder" {% if image %}hidden{% endif %}><i data-lucide="landmark"></i></span>
  </div>
{% endwith %}
