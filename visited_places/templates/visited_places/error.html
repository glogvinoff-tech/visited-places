{% extends 'visited_places/base.html' %}
{% block title %}{{ title|default:'Ошибка' }} | Visited Places{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main class="auth-layout"><section class="auth-form-section">
  <h1>{{ title|default:'Действие не выполнено' }}</h1><p>{{ message }}</p>
  <a class="button primary" href="{% url 'visited_places:journal' %}"><i data-lucide="arrow-left"></i>Вернуться в журнал</a>
</section></main>
{% endblock %}
